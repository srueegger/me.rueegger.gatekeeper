id: me.rueegger.Gatekeeper
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: gatekeeper

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # Der Generator legt die vendorten Kisten und die Cargo-Konfiguration hierher.
    CARGO_HOME: /run/build/gatekeeper/cargo

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Kern der Anwendung: Zielbrowser laufen auf dem Host und werden direkt über ihre
  # Exec-Zeile gestartet. Aus der Sandbox geht das nur über das Host-Command-Portal.
  # Alle bequemen Alternativen (xdg-open, OpenURI-Portal, QDesktopServices) schlagen den
  # Default-Handler nach, und das sind wir selbst. Siehe ADR-1 und ADR-2.
  - --talk-name=org.freedesktop.Flatpak

  # Desktop-Einträge und Symbole der installierten Browser lesen.
  #
  # Das /usr des Hosts ist nur über host-os erreichbar und erscheint dann unter
  # /run/host/usr. Ein direktes --filesystem=/usr/share/applications lehnt Flatpak ab:
  # "Path /usr is reserved by Flatpak", denn dort liegt die Runtime. Siehe ADR-9.
  - --filesystem=host-os:ro
  - --filesystem=xdg-data/applications:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=/var/lib/snapd/desktop:ro

  # Sich selbst als Standardbrowser eintragen.
  - --filesystem=xdg-config/mimeapps.list:create

modules:
  - name: gatekeeper
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      # Im Paketbau gibt es kein Netz; die Abhängigkeiten liegen vendored vor.
      - -DGK_CARGO_OFFLINE=ON
    sources:
      - type: dir
        path: ..
        # Baureste gehören nicht ins Paket und kosten beim Kopieren dreistellige Megabyte.
        skip:
          - .flatpak-builder
          - .git
          - build
          - target
      - generated-sources.json
